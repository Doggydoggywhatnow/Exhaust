name: CI
on:
  push:
    branches: [dev, main]
  pull_request:

env:
  # Packages SDL3 needs to build its X11 and Wayland video drivers and its audio
  # backends on Linux. They are build-time only: SDL loads them with dlopen.
  LINUX_DEPS: >-
    libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev
    libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols
    libdecor-0-dev libegl-dev libudev-dev libasound2-dev libpulse-dev libdbus-1-dev

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - name: Rust toolchain (for AccessKit)
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cmake -S . -B build
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - run: >
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - run: cmake --build build-san --parallel
      - run: ctest --test-dir build-san --output-on-failure

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: cmake --install build --prefix "$PWD/install"
      - run: tools/check_size.sh "$PWD/install"

  # AccessKit builds from the vendored crates with no network (sub-slice 1b-i).
  a11y-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: cargo build --offline
        working-directory: third_party/accesskit-c
        run: cargo build --release --offline --locked
      - name: The static library exists
        shell: bash
        run: ls -l third_party/accesskit-c/target/release/ | grep -E 'accesskit\.lib|libaccesskit\.a'

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: >
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo -DEXHAUST_FUZZ=ON -DEXHAUST_A11Y=OFF
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build-fuzz --target fuzz_utf8 --parallel
      - name: Run the first fuzz target for 10 seconds
        run: mkdir -p corpus && ./build-fuzz/fuzz_utf8 -max_total_time=10 corpus
