name: CI
on:
  push:
    branches: [dev, main]
  pull_request:

env:
  # Packages SDL3 needs to build its X11 and Wayland video drivers and its audio
  # backends on Linux. They are build-time only: SDL loads them with dlopen.
  LINUX_DEPS: >-
    libx11-dev libxext-dev libxcursor-dev libxi-dev libxrandr-dev libxfixes-dev
    libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols
    libdecor-0-dev libegl-dev libudev-dev libasound2-dev libpulse-dev libdbus-1-dev nasm

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - name: NASM (lib-Peep's x86-64 assembly), Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) { choco install nasm -y --no-progress }
          Add-Content $env:GITHUB_PATH "C:\Program Files\NASM"
      - name: Rust toolchain (for AccessKit)
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cmake -S . -B build
      - run: cmake --build build --config Release --parallel
      - run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - run: >
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - run: cmake --build build-san --parallel
      - run: ctest --test-dir build-san --output-on-failure

  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: cmake --install build --prefix "$PWD/install"
      - run: tools/check_size.sh "$PWD/install"

  # The real AT-SPI adapter read by a client that behaves as a screen reader does (sub-slice 7h): finds the window, its focused widget by name, presses a button.
  # Windows (UI Automation) and macOS (NSAccessibility) have no such client in CI yet: see docs/ISSUES.md.
  a11y-atspi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS at-spi2-core libatspi2.0-dev libglib2.0-dev dbus pkg-config
      - name: Rust toolchain (for AccessKit)
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target exhaust a11y_client_atspi --parallel
      - run: ctest --test-dir build -R a11y_atspi --output-on-failure --no-tests=error

  # AccessKit builds from the vendored crates with no network (sub-slice 1b-i).
  a11y-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: cargo build --offline
        working-directory: third_party/accesskit-c
        run: cargo build --release --offline --locked
      - name: The static library exists
        shell: bash
        run: ls -l third_party/accesskit-c/target/release/ | grep -E 'accesskit\.lib|libaccesskit\.a'

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - run: >
          cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=RelWithDebInfo -DEXHAUST_FUZZ=ON -DEXHAUST_A11Y=OFF
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build-fuzz --target fuzz_utf8 fuzz_markdown fuzz_html fuzz_frontmatter fuzz_canvas fuzz_base_expr fuzz_base fuzz_image fuzz_audio fuzz_math fuzz_mermaid fuzz_import --parallel
      - name: UTF-8 and grapheme segmenter, 10 seconds
        run: mkdir -p corpus/utf8 && ./build-fuzz/fuzz_utf8 -max_total_time=10 corpus/utf8
      - name: Markdown tokenizer (with the incremental update), 60 seconds
        run: mkdir -p corpus/markdown && cp tests/data/sample_note.md corpus/markdown/ && ./build-fuzz/fuzz_markdown -max_total_time=60 -max_len=4096 corpus/markdown
      - name: HTML subset, 60 seconds
        run: mkdir -p corpus/html && printf '<p onclick=x>hi <b>there</b><script>x</script><a href="javascript:y">z</a></p>' > corpus/html/seed.html && ./build-fuzz/fuzz_html -max_total_time=60 -max_len=4096 corpus/html
      - name: Frontmatter and property edits, 60 seconds
        run: mkdir -p corpus/frontmatter && cp tests/data/links_vault/Home.md tests/data/links_vault/Beta.md corpus/frontmatter/ && ./build-fuzz/fuzz_frontmatter -max_total_time=60 -max_len=4096 corpus/frontmatter
      - name: JSON Canvas, 60 seconds
        run: mkdir -p corpus/canvas && cp tests/data/canvas/sample.canvas corpus/canvas/ && ./build-fuzz/fuzz_canvas -max_total_time=60 -max_len=8192 corpus/canvas
      - name: Bases expressions, 60 seconds
        run: mkdir -p corpus/base_expr && cp tests/data/base/seed*.expr corpus/base_expr/ && ./build-fuzz/fuzz_base_expr -max_total_time=60 -max_len=2048 corpus/base_expr
      - name: Pictures (PNG, JPEG, GIF, BMP, WebP, AVIF, SVG), 60 seconds
        run: mkdir -p corpus/image && cp tests/data/images/* corpus/image/ && ./build-fuzz/fuzz_image -max_total_time=60 -max_len=2048 corpus/image
      - name: Audio (WAV, FLAC, MP3, Ogg Vorbis), 60 seconds
        run: mkdir -p corpus/audio && cp tests/data/audio/tone16.wav tests/data/audio/tone.flac tests/data/audio/tone.mp3 tests/data/audio/tone.ogg tests/data/audio/tone_alaw.wav tests/data/audio/tone_ima.wav corpus/audio/ && ./build-fuzz/fuzz_audio -max_total_time=60 -max_len=65536 corpus/audio
      - name: Math (LaTeX subset), 60 seconds
        run: mkdir -p corpus/math && cp tests/data/math/seed*.tex corpus/math/ && ./build-fuzz/fuzz_math -max_total_time=60 -max_len=512 corpus/math
      - name: Mermaid diagrams, 60 seconds
        run: mkdir -p corpus/mermaid && cp tests/data/mermaid/*.mmd corpus/mermaid/ && ./build-fuzz/fuzz_mermaid -max_total_time=60 -max_len=2048 corpus/mermaid
      - name: Importers (HTML to Markdown, CSV, ZIP), 60 seconds
        run: mkdir -p corpus/import && cp tests/data/import/seed*.bin corpus/import/ && ./build-fuzz/fuzz_import -max_total_time=60 -max_len=4096 corpus/import
      - name: Bases files, 60 seconds
        run: mkdir -p corpus/base && cp tests/data/base/*.base corpus/base/ && ./build-fuzz/fuzz_base -max_total_time=60 -max_len=4096 corpus/base
      - name: Keep what a fuzzer found
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            timeout-*
            oom-*
          if-no-files-found: ignore
